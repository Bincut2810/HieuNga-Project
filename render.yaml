# Optional Render Blueprint — import in Render Dashboard → Blueprints
# Or create services manually using docs/DEPLOY-RENDER.md
# Do NOT commit real secrets — set sync: false vars in Render dashboard.

databases:
  - name: hieunga-db
    plan: free
    databaseName: hieunga
    user: hieunga

services:
  - type: web
    name: hieunga-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: hieunga-db
          property: connectionString
      - key: Site__BaseUrl
        value: https://hieunga-web.onrender.com
      - key: Site__Name
        value: Xe Máy Hiếu Nga
      - key: Site__Hotline
        value: "0905 123 456"
      - key: Site__ZaloUrl
        value: https://zalo.me/0905123456
      - key: Site__DefaultSeoTitle
        value: Xe Máy Hiếu Nga | Mua xe và dịch vụ xe máy
      - key: Site__DefaultSeoDescription
        value: Mua xe máy, tư vấn trả góp và đặt lịch sửa chữa, bảo dưỡng tại Đà Nẵng.
      - key: SeedOptions__EnableDemoSeed
        value: "true"
      - key: SeedOptions__AdminSeedEnabled
        value: "true"
      - key: SeedOptions__AdminEmail
        sync: false
      - key: SeedOptions__AdminPassword
        sync: false
      - key: ImageStorage__Provider
        value: Cloudinary
      - key: ImageStorage__MaxFileSizeMb
        value: "5"
      - key: ImageStorage__Cloudinary__CloudName
        sync: false
      - key: ImageStorage__Cloudinary__ApiKey
        sync: false
      - key: ImageStorage__Cloudinary__ApiSecret
        sync: false
